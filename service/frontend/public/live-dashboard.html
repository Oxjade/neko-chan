<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neko-Chan Live Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: #14131a; color: #f0f0f0; padding: 20px; }
h1 { font-size: 20px; margin-bottom: 4px; color: #f0f0f0; }
.sub { font-size: 13px; color: #888; margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 16px; }
.card { background: #1c1b24; border-radius: 16px; padding: 20px; border: 1px solid #2a2834; }
.card h2 { font-size: 15px; margin-bottom: 12px; color: #aaa; }
.card .price { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar-wrap { position: relative; height: 20px; margin: 8px 0; background: #2a2834; border-radius: 10px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 10px; transition: width 1s ease; }
.bar-marker { position: absolute; top: -2px; width: 4px; height: 24px; border-radius: 2px; transform: translateX(-50%); transition: left 1s ease; }
.row { display: flex; justify-content: space-between; font-size: 13px; margin: 4px 0; color: #aaa; }
.row span { font-variant-numeric: tabular-nums; }
.row .val { color: #f0f0f0; }
.pnl-up { color: #4ade80 !important; }
.pnl-down { color: #f87171 !important; }
.stop { color: #f87171; }
.target { color: #4ade80; }
.entry { color: #fbbf24; }
.summary { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: #1c1b24; border-radius: 12px; padding: 14px 20px; min-width: 140px; border: 1px solid #2a2834; }
.stat .label { font-size: 11px; color: #888; text-transform: uppercase; }
.stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: #888; margin: 4px 0 12px; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.last-update { font-size: 12px; color: #555; text-align: right; margin-top: 12px; }
</style>
</head>
<body>

<h1>🐾 Neko-Chan Live Dashboard</h1>
<div class="sub">Positions · TP/SL visibility · real-time price</div>

<div class="summary" id="summary"></div>
<div class="legend">
  <span><span class="dot" style="background:#fbbf24"></span> Entry</span>
  <span><span class="dot" style="background:#4ade80"></span> Take-Profit</span>
  <span><span class="dot" style="background:#f87171"></span> Stop-Loss</span>
  <span><span class="dot" style="background:#60a5fa"></span> Current Price</span>
</div>
<div class="grid" id="grid"></div>
<div class="last-update" id="ts"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const BASE = '';
const API_BASE = BASE + '/api';

async function load() {
  try {
    const r = await fetch(API_BASE + '/positions', { headers: { Authorization: 'Bearer ' + TOKEN } });
    const d = await r.json();
    render(d);
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="card" style="grid-column:1/-1">⚠️ ' + e.message + '</div>';
  }
}

function render(d) {
  const pos = d.positions || [];
  const cash = d.cash || 0;
  let pv = 0, openPnl = 0;
  for (const p of pos) {
    const c = p.current_price || p.entry_price;
    pv += Math.abs(p.quantity) * c;
    openPnl += (c - p.entry_price) * (p.quantity >= 0 ? p.quantity : -p.quantity);
  }
  const eq = cash + pv;
  const pnlTotal = eq - 100000;

  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="label">Equity</div><div class="value" style="color:${pnlTotal>=0?'#4ade80':'#f87171'}">$${eq.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>
    <div class="stat"><div class="label">P&L vs \$100k</div><div class="value" style="color:${pnlTotal>=0?'#4ade80':'#f87171'}">${pnlTotal>=0?'+':''}$${pnlTotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>
    <div class="stat"><div class="label">Open Positions</div><div class="value">${pos.length}</div></div>
    <div class="stat"><div class="label">Cash</div><div class="value">$${cash.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>
  `;

  let html = '';
  for (const p of pos) {
    const sym = p.symbol;
    const qty = p.quantity;
    const entry = p.entry_price;
    const current = p.current_price || entry;
    const sl = p.stop_loss;
    const tp = p.take_profit;
    const side = qty >= 0 ? 'long' : 'short';
    const pnl = (current - entry) * (qty >= 0 ? qty : -qty);
    const pnlPct = ((current / entry) - 1) * 100 * (qty >= 0 ? 1 : -1);
    const isUp = pnl >= 0;

    // compute visual bar: range from stop to target
    const lo = sl ? Math.min(sl, entry, current) : Math.min(entry, current) * 0.95;
    const hi = tp ? Math.max(tp, entry, current) : Math.max(entry, current) * 1.05;
    const range = hi - lo || 1;
    const entryPct = ((entry - lo) / range) * 100;
    const currentPct = ((current - lo) / range) * 100;
    const slPct = sl ? ((sl - lo) / range) * 100 : null;
    const tpPct = tp ? ((tp - lo) / range) * 100 : null;

    // distance to stop & target
    const toSl = sl ? ((current - sl) / sl * 100) : null;
    const toTp = tp ? ((tp - current) / current * 100) : null;
    const slDist = sl ? Math.abs(current - sl) / Math.abs(entry - sl) * 100 : null;
    const tpDist = tp ? Math.abs(current - tp) / Math.abs(entry - tp) * 100 : null;

    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2>${sym} <span style="font-weight:400;font-size:13px;color:#888">${side.toUpperCase()} · ${Math.abs(qty).toFixed(4)}</span></h2>
        <span style="font-size:22px;font-weight:700;${isUp?'color:#4ade80':'color:#f87171'}">${isUp?'+':''}$${pnl.toFixed(2)}</span>
      </div>
      <div class="row"><span>Entry</span><span class="val entry">$${entry.toFixed(2)}</span></div>
      <div class="row"><span>Current</span><span class="val" style="color:#60a5fa">$${current.toFixed(2)}</span></div>
      <div class="row"><span>Stop ${sl?'$'+sl.toFixed(2):'(none)'}</span><span class="val stop">${slDist!==null?slDist.toFixed(0)+'% toward stop':'-'}</span></div>
      <div class="row"><span>Target ${tp?'$'+tp.toFixed(2):'(none)'}</span><span class="val target">${tpDist!==null?tpDist.toFixed(0)+'% toward target':'-'}</span></div>
      <div class="row"><span>P&L %</span><span class="val ${isUp?'pnl-up':'pnl-down'}">${pnlPct.toFixed(2)}%</span></div>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${currentPct.toFixed(1)}%;background:${isUp?'#4ade8044':'#f8717144'};"></div>
        ${entryPct!==null?`<div class="bar-marker" style="left:${entryPct.toFixed(1)}%;background:#fbbf24;height:24px;width:3px;top:-2px;"></div>`:''}
        ${slPct!==null?`<div class="bar-marker" style="left:${slPct.toFixed(1)}%;background:#f87171;height:28px;width:3px;top:-4px;"></div>`:''}
        ${tpPct!==null?`<div class="bar-marker" style="left:${tpPct.toFixed(1)}%;background:#4ade80;height:28px;width:3px;top:-4px;"></div>`:''}
        <div class="bar-marker" style="left:${currentPct.toFixed(1)}%;background:#60a5fa;height:30px;width:4px;top:-5px;z-index:2;border-radius:2px;box-shadow:0 0 6px rgba(96,165,250,0.6);"></div>
      </div>
    </div>`;
  }
  document.getElementById('grid').innerHTML = html || '<div class="card" style="grid-column:1/-1">No open positions</div>';
  document.getElementById('ts').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
