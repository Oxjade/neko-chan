<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neko · Trenches (Sui) — indexer live</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#111419; --line:#1d222a; --txt:#e6e9ee; --dim:#8b94a3;
    --green:#2fd47f; --red:#ff5d6c; --amber:#ffb454; --accent:#7aa2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:13px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  header{display:flex;align-items:center;gap:14px;padding:14px 18px;
         border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .logo{font-weight:700;font-size:15px;letter-spacing:.5px}
  .logo b{color:var(--green)}
  .pill{padding:2px 9px;border:1px solid var(--line);border-radius:99px;color:var(--dim);font-size:11px}
  .pill.ok{color:var(--green);border-color:#1d4432}
  .pill.bad{color:var(--red);border-color:#4a1f24}
  .grow{flex:1}
  select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);
                border-radius:6px;padding:4px 8px;font:inherit}
  main{display:grid;grid-template-columns:1fr 360px;gap:0;min-height:calc(100vh - 53px)}
  section{border-right:1px solid var(--line)}
  #tapeWrap{border-right:none;padding:10px 12px;overflow-y:auto;max-height:calc(100vh - 53px)}
  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:0;background:var(--bg);text-align:left;color:var(--dim);
           font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
           padding:8px 10px;border-bottom:1px solid var(--line);cursor:default}
  tbody td{padding:7px 10px;border-bottom:1px solid #151920;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#141a22}
  tbody tr.sel{background:#17202c}
  .name{display:flex;align-items:center;gap:8px;max-width:260px}
  .name img{width:20px;height:20px;border-radius:50%;background:#222;flex:none}
  .name span.n{overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .sym{color:var(--dim);font-size:11px}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .up{color:var(--green)} .down{color:var(--red)} .dim{color:var(--dim)}
  .buy{color:var(--green)} .sell{color:var(--red)}
  .age{color:var(--dim);font-size:11px}
  #tape h3{margin:2px 0 8px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:500}
  .row{padding:5px 6px;border-bottom:1px solid #141920;display:flex;gap:8px;align-items:baseline;font-size:12px}
  .row.flash{animation:flash .9s ease-out}
  @keyframes flash{0%{background:#1b3a28}100%{background:transparent}}
  .row .side{width:42px;font-weight:700}
  .row .amt{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
  .row .sub{color:var(--dim);font-size:10px}
  #detail{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
  #detail h4{margin:0 0 6px;font-size:12px;color:var(--accent)}
  #detail .kv{display:grid;grid-template-columns:90px 1fr;gap:2px 8px;font-size:11px;color:var(--dim)}
  #detail .kv b{color:var(--txt);font-weight:500;overflow-wrap:anywhere}
  .bs i{font-style:normal}
  .bs i.b{color:var(--green)} .bs i.s{color:var(--red)}
  footer{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);
         background:var(--bg);padding:4px 18px;font-size:11px;color:var(--dim)}
  #hits{position:absolute;right:0;top:34px;width:320px;max-height:60vh;overflow-y:auto;
        background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:9;
        box-shadow:0 8px 30px #000a}
  #hits .hit{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer;border-bottom:1px solid #151920}
  #hits .hit:hover{background:#171d26}
  #hits .hit img{width:22px;height:22px;border-radius:50%;background:#222}
  #hits .hit .sym{margin-left:auto;font-size:11px}
  #hits .none{padding:9px 10px;color:var(--dim)}
  tr.dormant td{opacity:.55}
  @media (max-width:900px){main{grid-template-columns:1fr}section#tapeWrap{max-height:45vh}}
</style>
</head>
<body>
<header>
  <div class="logo">Neko<b>·</b>trenches</div>
  <span class="pill">chain: sui mainnet</span>
  <span class="pill" id="pLive">live —</span>
  <span class="pill" id="pNorm">norm —</span>
  <span class="pill" id="pDlq">dlq —</span>
  <div class="grow"></div>
  <div style="position:relative">
    <input id="q" placeholder="search token: name / symbol / 0x…" autocomplete="off"
           style="background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:5px 9px;width:250px;font:inherit">
    <div id="hits" hidden></div>
  </div>
  <label class="dim">window
    <select id="win">
      <option value="1">1h</option>
      <option value="6">6h</option>
      <option value="24" selected>24h</option>
      <option value="all">all</option>
    </select>
  </label>
  <button id="refresh">refresh</button>
</header>
<main>
  <section id="list">
    <table>
      <thead><tr>
        <th>#</th><th>Token</th><th class="num">Price ₢</th><th class="num">Δ</th>
        <th class="num">Vol ₢</th><th class="num">Trades</th><th>B/S</th>
        <th class="num">Last</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="dim">loading…</td></tr></tbody>
    </table>
  </section>
  <section id="tapeWrap">
    <div id="tape"><h3>Live tape · normalized writer</h3><div id="tapeRows"></div></div>
    <div id="detail" hidden></div>
  </section>
</main>
<footer id="foot">connecting…</footer>
<script>
const $=s=>document.querySelector(s);
const fmt=s=>{ s=(s??'').toString(); const neg=s.startsWith('-'); s=s.replace('-','');
  const[i,f]=s.split('.'); if(!f) return (neg?'-':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'-':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+(f.length>4?f.slice(0,4):f); };
const ago=ms=>{const s=(Date.now()-ms)/1000; if(s<60)return Math.floor(s)+'s'; if(s<3600)return Math.floor(s/60)+'m'; return Math.floor(s/3600)+'h';};
const suiMist=v=>fmt((BigInt(v||'0')*10000n/10n**9n)+'.'+((BigInt(v||'0')%(10n**9n)).toString().padStart(9,'0')).slice(0,2));
let tokens=[], sel=null;

async function loadTokens(){
  const w=$('#win').value;
  const r=await fetch('/api/tokens?window='+w+'&limit=100'); const ts=await r.json();
  tokens=ts; render();
}
function render(){
  const tb=$('#rows');
  if(!tokens.length){tb.innerHTML='<tr><td colspan="8" class="dim">no normalized trades yet — waiting for the stream…</td></tr>';return}
  tb.innerHTML=tokens.map((t,i)=>{
    const chg=t.change_pct==='—'?'<span class="dim">—</span>'
      :`<span class="${+t.change_pct>=0?'up':'down'}">${(+t.change_pct>=0?'+':'')+fmt(t.change_pct)}%</span>`;
    return `<tr data-c="${t.curve_id}" class="${sel===t.curve_id?'sel':''}${t.active?'':' dormant'}">
    <td class="dim">${i+1}</td>
    <td><div class="name">${t.icon_url?`<img src="${t.icon_url}" loading="lazy" onerror="this.style.visibility='hidden'">`:''}
      <span class="n">${esc(t.name)}</span><span class="sym">${esc(t.symbol)}</span></div></td>
    <td class="num">${fmt(t.price_sui)}</td>
    <td class="num">${chg}</td>
    <td class="num">${suiMist(t.vol_sui)}</td>
    <td class="num">${t.trades}</td>
    <td class="bs"><i class="b">${t.buys}</i>/<i class="s">${t.sells}</i></td>
    <td class="num age">${t.last_trade_ms?ago(t.last_trade_ms):'—'}</td></tr>`;}).join('');
  tb.querySelectorAll('tr').forEach(tr=>tr.onclick=()=>select(tr.dataset.c));
}
const esc=s=>(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function select(curve){
  sel=curve; render();
  const d=$('#detail'); d.hidden=false;
  d.innerHTML='<h4>loading…</h4>';
  const r=await fetch('/api/tokens/'+curve); const j=await r.json();
  const m=j.meta||{};
  d.innerHTML=`<h4>${esc(m.name||curve.slice(0,10))} · ${esc(m.symbol||'?')}</h4>
   <div class="kv">
     <b>curve</b><span>${esc(curve)}</span>
     ${m.token_type?`<b>coin</b><span>${esc(m.token_type)}</span>`:''}
     ${m.creator?`<b>creator</b><span>${esc(m.creator)}</span>`:''}
     <b>price</b><span>${j.last?fmt(tokens.find(t=>t.curve_id===curve)?.price_sui||'—')+' SUI':'—'}</span>
     ${m.description?`<b>desc</b><span>${esc(m.description)}</span>`:''}
   </div>
   <h4 style="margin-top:10px">recent trades</h4>
   <div id="tr"></div>`;
  $('#tr').innerHTML=(j.trades||[]).map(x=>`<div class="row">
     <span class="side ${x.side==='buy'?'buy':'sell'}">${x.side}</span>
     <span class="dim">${ago(x.ts_ms)}</span>
     <span class="amt">${suiMist(x.amount_sui)} ₢ → ${fmt(x.amount_token)} tok</span></div>`).join('')
     ||'<div class="dim">none</div>';
}

function tapeRow(x){
  const el=document.createElement('div');
  el.className='row flash';
  const cp=x.checkpoint;
  if(x.src==='bond'){
    const side=x.side;
    el.innerHTML=`<span class="side ${side==='buy'?'buy':'sell'}">${side}</span>
      <span>${nameFor(x.entity)}</span><span class="sub">${x.entity.slice(0,10)}</span>
      <span class="amt">${suiMist(x.a_sui)} ₢<div class="sub">cp ${cp}</div></span>`;
  }else{
    el.innerHTML=`<span class="side" style="color:var(--amber)">swap</span>
      <span class="dim">${x.entity.slice(0,10)}</span>
      <span class="amt">${fmt(x.a_in)}→${fmt(x.a_out)}<div class="sub">cp ${cp}</div></span>`;
  }
  return el;
}
const nameFor=c=>{const t=tokens.find(x=>x.curve_id===c);return t?esc(t.symbol):'<span class="dim">token</span>'};

let ws;
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onopen=()=>{$('#foot').textContent='ws connected'};
  ws.onmessage=e=>{
    const j=JSON.parse(e.data);
    if(j.type==='status')status(j.status);
    if(j.type==='trades'){
      const box=$('#tapeRows');
      for(const x of j.rows){box.prepend(tapeRow(x));}
      while(box.children.length>80)box.lastChild.remove();
    }
  };
  ws.onclose=()=>{$('#foot').textContent='ws reconnecting…';setTimeout(connect,2000)};
}
function status(s){
  const c=s.cursors||{};
  $('#pLive').textContent='live '+(c.live??'—');
  $('#pNorm').textContent='norm '+(c.normalized??'—');
  $('#pNorm').className='pill '+(s.lag_cp<=3?'ok':'bad');
  $('#pDlq').textContent='dlq '+s.counts.dlq;
  $('#pDlq').className='pill '+(s.counts.dlq===0?'ok':'bad');
  $('#foot').textContent=`live ${c.live} · normalized ${c.normalized} (lag ${s.lag_cp} cp) · bonding_trades ${s.counts.bonding_trades} · swaps ${s.counts.swaps} · dlq ${s.counts.dlq}`;
}

let qT;
$('#q').oninput=()=>{clearTimeout(qT);const v=$('#q').value.trim();
  if(v.length<2&&!/^0x/.test(v)){$('#hits').hidden=true;return}
  qT=setTimeout(async()=>{
    const r=await fetch('/api/search?q='+encodeURIComponent(v)); const hits=await r.json();
    $('#hits').hidden=false;
    $('#hits').innerHTML=hits.length?hits.map(h=>`<div class="hit" data-c="${h.curve_id}">
      ${h.icon_url?`<img src="${h.icon_url}" onerror="this.style.visibility='hidden'">`:'<img alt="" style="opacity:.2">'}
      <span><b>${esc(h.name||h.curve_id.slice(0,10))}</b> <span class="sym">${esc(h.symbol||'')}</span></span>
      <span class="sub dim" style="margin-left:auto;font-size:10px">${h.trades?h.trades+' idx trades':''}</span></div>`).join('')
      :'<div class="none">no match in launchpad catalog or indexed curves</div>';
    $('#hits').querySelectorAll('.hit').forEach(el=>el.onclick=()=>{
      $('#hits').hidden=true;
      const c=el.dataset.c;
      if(!tokens.some(t=>t.curve_id===c)){ loadTokens().then(()=>select(c)); } else select(c);
    });
  },350);
};
$('#q').onblur=()=>setTimeout(()=>$('#hits').hidden=true,250);
$('#win').onchange=loadTokens;
$('#refresh').onclick=loadTokens;
loadTokens();connect();setInterval(loadTokens,15000);
</script>
</body>
</html>
